name: Update domain sets

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

concurrency:
  group: update-domainsets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run checks
        shell: bash
        run: |
          set -euo pipefail
          shellcheck ./domainset-generator.sh ./tests/*.bash ./scripts/*.bash
          bash ./tests/normalize.bash
          bash ./tests/reliability.bash

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: write
    env:
      RELEASE_TAG: latest
      RELEASE_TITLE: domainset
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate domain sets
        shell: bash
        # Downloads retry inside curl; validation failures are deterministic.
        run: bash ./domainset-generator.sh
      - name: Build release metadata
        shell: bash
        run: bash ./scripts/release-metadata.bash
      - name: Publish domain sets
        shell: bash
        run: |
          set -euo pipefail
          # The release already exists; upload fails loudly if it was deleted.
          gh release upload "$RELEASE_TAG" ads.txt china.txt apple-china.txt manifest.json --clobber
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > release-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              ads.txt|china.txt|apple-china.txt|manifest.json) ;;
              *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
            esac
          done < release-assets.txt
