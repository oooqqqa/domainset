name: Update Lists

on:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:
    inputs:
      min_lines:
        description: Default minimum line count required for each generated list
        required: false
        type: number
      ads_min_lines:
        description: Minimum line count required for ads.txt
        required: false
        type: number
      nsfw_min_lines:
        description: Minimum line count required for nsfw.txt
        required: false
        type: number
      chinese_mainland_min_lines:
        description: Minimum line count required for chinese-mainland.txt
        required: false
        type: number

concurrency:
  group: update-lists
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: latest
      RELEASE_TITLE: domainset latest
      MIN_LINES: ${{ github.event.inputs.min_lines || '' }}
      ADS_MIN_LINES: ${{ github.event.inputs.ads_min_lines || '' }}
      NSFW_MIN_LINES: ${{ github.event.inputs.nsfw_min_lines || '' }}
      CHINESE_MAINLAND_MIN_LINES: ${{ github.event.inputs.chinese_mainland_min_lines || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        shell: bash
        run: bash ./tests/normalize.bash

      - name: Run domainset-generator.sh
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            bash ./domainset-generator.sh && exit 0
            echo "retry $i/3 failed, waiting..."
            sleep 5
          done
          echo "all retries exhausted" >&2
          exit 1

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          assets=(ads.txt nsfw.txt chinese-mainland.txt)
          release_assets=(ads.txt nsfw.txt chinese-mainland.txt SHA256SUMS manifest.json)
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          source_for() {
            case "$1" in
              ads.txt) printf 'OISD big' ;;
              nsfw.txt) printf 'OISD NSFW' ;;
              chinese-mainland.txt) printf 'felixonmars dnsmasq china list' ;;
              *) printf 'unknown' ;;
            esac
          }

          {
            printf 'Auto-updated: %s UTC\n\n' "$(date -u +%Y-%m-%d\ %H:%M:%S)"
            printf 'This is a rolling `latest` release updated by GitHub Actions.\n\n'
            printf '## Generated lists\n\n'
            printf '| File | Source | Lines |\n'
            printf '| --- | --- | ---: |\n'
          } > "$notes_file"

          {
            printf '## Generated lists\n\n'
            printf '| File | Source | Lines |\n'
            printf '| --- | --- | ---: |\n'
          } >> "$GITHUB_STEP_SUMMARY"

          for file in "${assets[@]}"; do
            [[ -s "$file" ]] || { echo "$file: missing or empty" >&2; exit 1; }
            count=$(wc -l < "$file")
            source=$(source_for "$file")
            printf '| `%s` | %s | %s |\n' "$file" "$source" "$count" >> "$notes_file"
            printf '| `%s` | %s | %s |\n' "$file" "$source" "$count" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            printf '\n## Verification\n\n'
            printf 'Use `SHA256SUMS` to verify downloaded files. `manifest.json` includes source URLs, line counts, commit, and checksums.\n'
          } >> "$notes_file"

          sha256sum "${assets[@]}" > SHA256SUMS

          {
            printf '{\n'
            printf '  "generated_at": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "commit": "%s",\n' "$GITHUB_SHA"
            printf '  "sources": {\n'
            printf '    "ads.txt": ["https://big.oisd.nl"],\n'
            printf '    "nsfw.txt": ["https://nsfw.oisd.nl"],\n'
            printf '    "chinese-mainland.txt": ["https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/refs/heads/master/accelerated-domains.china.conf"]\n'
            printf '  },\n'
            printf '  "files": {\n'
          } > manifest.json

          for index in "${!assets[@]}"; do
            file="${assets[$index]}"
            count=$(wc -l < "$file")
            hash=$(sha256sum "$file" | awk '{print $1}')
            comma=","
            if [[ "$index" -eq $((${#assets[@]} - 1)) ]]; then
              comma=""
            fi
            printf '    "%s": {"lines": %s, "sha256": "%s"}%s\n' "$file" "$count" "$hash" "$comma" >> manifest.json
          done

          {
            printf '  }\n'
            printf '}\n'
          } >> manifest.json

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$notes_file" --latest=false
          fi

          gh release delete-asset "$RELEASE_TAG" blocklist.txt --yes >/dev/null 2>&1 || true
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
