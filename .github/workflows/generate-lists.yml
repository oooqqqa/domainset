name: Update Lists

on:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:
    inputs:
      min_lines:
        description: Minimum line count required for each generated list
        required: false
        default: '1000'

concurrency:
  group: update-lists
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: latest
      RELEASE_TITLE: domainset latest
      MIN_LINES: ${{ github.event.inputs.min_lines || '1000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run domainset-generator.sh
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            bash ./domainset-generator.sh && exit 0
            echo "retry $i/3 failed, waiting..."
            sleep 5
          done
          echo "all retries exhausted" >&2
          exit 1

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          assets=(blocklist.txt nsfw.txt chinese-mainland.txt)
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          {
            printf 'Auto-updated on %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '## 域名统计\n\n'
            printf '| List | Lines |\n'
            printf '| --- | ---: |\n'
          } > "$notes_file"

          for file in "${assets[@]}"; do
            [[ -s "$file" ]] || { echo "$file: missing or empty" >&2; exit 1; }
            count=$(wc -l < "$file")
            printf -- '- **%s**: %s 条\n' "${file%.txt}" "$count" >> "$notes_file"
            printf '| `%s` | %s |\n' "$file" "$count" >> "$GITHUB_STEP_SUMMARY"
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$notes_file" --latest=false
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
