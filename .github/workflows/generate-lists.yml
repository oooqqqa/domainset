name: Update ads

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

concurrency:
  group: update-ads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          shellcheck ./domainset-generator.sh ./tests/normalize.bash
          bash ./tests/normalize.bash

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: write
    env:
      RELEASE_TAG: latest
      RELEASE_TITLE: domainset

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate ads.txt
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bash ./domainset-generator.sh; then
              exit 0
            fi
            echo "warning: attempt $attempt/3 failed"
            sleep 10
          done
          echo "error: all attempts failed" >&2
          exit 1

      - name: Publish ads.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          notes="Generated ads.txt from https://big.oisd.nl"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ads.txt --clobber
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG" --force
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$notes"
          else
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG" --force
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$notes" --latest=false
            gh release upload "$RELEASE_TAG" ads.txt --clobber
          fi

          mapfile -t assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            if [[ "$asset" != "ads.txt" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done
