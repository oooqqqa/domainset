name: Update Lists

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:
    inputs:
      min_lines:
        description: Default minimum line count required for each generated list
        required: false
        type: number
      ads_min_lines:
        description: Minimum line count required for ads.txt
        required: false
        type: number
      nsfw_min_lines:
        description: Minimum line count required for nsfw.txt
        required: false
        type: number
      chinese_mainland_min_lines:
        description: Minimum line count required for chinese-mainland.txt
        required: false
        type: number

concurrency:
  group: update-lists
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        shell: bash
        run: |
          bash ./tests/normalize.bash
          bash ./tests/release-assets.bash

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: write
    env:
      RELEASE_TAG: latest
      RELEASE_TITLE: domainset
      MIN_LINES: ${{ github.event.inputs.min_lines || '' }}
      ADS_MIN_LINES: ${{ github.event.inputs.ads_min_lines || '' }}
      NSFW_MIN_LINES: ${{ github.event.inputs.nsfw_min_lines || '' }}
      CHINESE_MAINLAND_MIN_LINES: ${{ github.event.inputs.chinese_mainland_min_lines || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run domainset-generator.sh
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            bash ./domainset-generator.sh && exit 0
            echo "retry $i/3 failed, waiting..."
            sleep 5
          done
          echo "all retries exhausted" >&2
          exit 1

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE=release-notes.md SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash ./scripts/build-release-assets.sh
          mapfile -t generated_assets < <(awk -F '\t' 'NR > 1 {print $1}' domainsets.tsv)
          release_assets=("${generated_assets[@]}" SHA256SUMS manifest.json)

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --latest=false
          fi

          mapfile -t current_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in "${current_assets[@]}"; do
            keep=false
            for expected in "${release_assets[@]}"; do
              if [[ "$asset" == "$expected" ]]; then
                keep=true
                break
              fi
            done
            if [[ "$keep" == false ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done

          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
